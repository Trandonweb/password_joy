<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220"><title>JOY Cipher</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#29375f 0,transparent 55%),#0b1220;color:#eef4ff;font-family:Inter,Pretendard,system-ui,sans-serif;display:grid;place-items:center;padding:24px}

</style></head><body><main><div class="mark">A PERSONAL CIPHER SYSTEM</div><h1>JOY<span style="color:#9eacff">.</span></h1><p class="desc">나만의 규칙으로 문자를 바꾸는 JOY 암호 변환기<br>사용할 진법을 선택하세요.</p><section class="cards">
